    rarete: commun
  kit_de_crochetage:
    nom: "Kit de crochetage"
    description: "Étui de cuir contenant crochets, tensionneurs et limes"
    valeur_or: 15
    poids: 0.5
    effet: "Permet de crocheter les serrures"
    rarete: commun
  lanterne:
    nom: "Lanterne"
    description: "Lanterne en fer forgé avec verre fumé, protège la flamme du vent"
    valeur_or: 8
    poids: 2
    effet: "Lumière dans un rayon de 12m, 1 flacon d'huile = 6h"
    rarete: commun
  huile:
    nom: "Huile (flacon)"
    description: "Flacon d'huile combustible, peut aussi graisser ou être enflammé"
    valeur_or: 1
    poids: 0.5
    effet: "6h de lanterne, ou 1d4 dégâts de feu zone 1m"
    rarete: commun

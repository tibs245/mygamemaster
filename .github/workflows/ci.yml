---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff + yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ruff yamllint

      - name: Run ruff
        run: ruff check .

      - name: Run yamllint
        run: yamllint .

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test suite — scripts (unittest discover)
        run: |
          cd modules/gaming/mygamemaster/scripts
          python3 -m unittest discover -s tests
          echo "scripts tests: exit $?"

      - name: Test suite — hooks (test_hooks.py)
        run: |
          cd modules/gaming/mygamemaster/hooks
          python3 test_hooks.py
          echo "hooks tests: exit $?"

      - name: Test suite — TTS (test_tts.py)
        run: |
          cd modules/gaming/mygamemaster-tts/tests
          python3 test_tts.py
          echo "tts tests: exit $?"

      - name: Test suite — repo scripts (unittest discover)
        run: |
          cd scripts
          python3 -m unittest discover -s tests
          echo "repo scripts tests: exit $?"

      - name: File references (no dangling links)
        run: python3 scripts/check_references.py

      # Fails at 90% of the 100 000-character skill limit. Escape hatch for a
      # live campaign: set MGM_SKILL_SIZE_SKIP=1 in the job environment.
      - name: Skill character budget (no skill near the freeze limit)
        run: python3 scripts/check_skill_size.py --verbose

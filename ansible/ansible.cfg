[defaults]
# Single source of truth: the dynamic inventory reads inventory/games.yml
# (your real table) — or games.example.yml as a fallback — and exposes every
# game entry as a host of the `campaigns` group. Add a game = add a table row.
inventory = inventory/hermes_inventory.py
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# Human-readable YAML output via the built-in callback (ansible.builtin.default).
# NB: the old `stdout_callback = yaml` (community.general.yaml) was REMOVED in
# community.general 12; we now use its result_format option instead.
callback_result_format = yaml
nocows = 1
interpreter_python = auto_silent
# Uncomment to avoid --ask-vault-pass every time (file mode 0600, outside the repo):
# vault_password_file = ~/.config/hermes-mj/.vault_pass

[privilege_escalation]
become = False

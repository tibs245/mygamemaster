---
# Updates ONLY the rendered configuration (config.yaml + SOUL.md) for a
# campaign, then triggers a restart notification. Reusable standalone (update-config.yml).

- name: Check variables required for config
  ansible.builtin.assert:
    that:
      - campagne_slug is defined
      - campagne_data_dir is defined
    fail_msg: "Requires -e game=<slug> (legacy alias: -e campagne=) and the games.yml table entry (campagne_data_dir)."

- name: Create the rendered configs directory
  ansible.builtin.file:
    path: "{{ rendered_dir }}"
    state: directory
    mode: "0755"

- name: Render config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ rendered_dir }}/config.yaml"
    mode: "0644"
  notify: restart_campagne

- name: Render SOUL.md
  ansible.builtin.template:
    src: SOUL.md.j2
    dest: "{{ rendered_dir }}/SOUL.md"
    mode: "0644"
  notify: restart_campagne

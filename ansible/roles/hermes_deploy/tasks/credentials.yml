---
# Updates ONLY the secrets (credentials) of a campaign:
# resolves the Discord token from the vault, writes the environment file (0600),
# and triggers a restart notification. Reusable standalone (update-credentials.yml).

- name: Check variables required for credentials
  ansible.builtin.assert:
    that:
      - campaign_slug is defined
      - discord_secret_key is defined
    fail_msg: "Requires -e game=<slug> (legacy alias: -e campagne=) and the games.yml table entry (discord_secret_key)."

- name: Resolve the Discord token from the vault
  ansible.builtin.set_fact:
    discord_bot_token: "{{ lookup('vars', discord_secret_key, default='') }}"

- name: Require secrets (Discord token + OpenRouter key)
  ansible.builtin.assert:
    that:
      - discord_bot_token | length > 0
      - openrouter_api_key is defined and openrouter_api_key | length > 0
    fail_msg: >-
      Missing secrets. Check vault.yml ({{ discord_secret_key }}, openrouter_api_key)
      and use --ask-vault-pass.

- name: Create the environment files directory
  ansible.builtin.file:
    path: "{{ host_env_dir }}"
    state: directory
    mode: "0700"

- name: Write the environment file (secrets, 0600)
  ansible.builtin.copy:
    dest: "{{ host_env_dir }}/{{ deploy_id }}.env"
    mode: "0600"
    # MINIMAX_API_KEY is OPTIONAL: the narrative voice (tts axis) is fail-open —
    # without a key, TTS is a silent no-op. It is only injected if defined
    # in the vault (no assert: it is a bonus feature). See docs/monde-vivant/10-features.md.
    #
    # _HERMES_FORCE_OPENROUTER_API_KEY: required for skill scripts launched BY
    # THE AGENT (terminal tool). Hermes 0.16 scrubs provider keys (including OPENROUTER_API_KEY)
    # from the agent's subprocess environment on EVERY command — _make_run_env /
    # _HERMES_PROVIDER_ENV_BLOCKLIST in tools/environments/local.py (hardening
    # GHSA-rhgp-j443-p4rf). The native `_HERMES_FORCE_<VAR>` prefix is the intended
    # escape hatch provided by Hermes: the variable is un-prefixed and re-injected as <VAR>
    # into agent commands. Scripts (llm_judge.py, tts_format.py, image) read OPENROUTER_API_KEY
    # without modification. HOOKS (process gateway, not scrubbed) use OPENROUTER_API_KEY directly.
    # WARNING: Deliberately bypasses the anti-exfiltration guard: the agent can read the OpenRouter key.
    # MiniMax is ALSO a Hermes provider: MINIMAX_API_KEY is on the dynamic blocklist
    # (_build_provider_env_blocklist via PROVIDER_REGISTRY) -> scrubbed for the agent like
    # OPENROUTER. Voice synthesis (tts_generate) is launched BY THE AGENT -> the same
    # _HERMES_FORCE_ is needed so it can see the key, otherwise "voice unavailable".
    content: |
      OPENROUTER_API_KEY={{ openrouter_api_key }}
      _HERMES_FORCE_OPENROUTER_API_KEY={{ openrouter_api_key }}
      DISCORD_BOT_TOKEN={{ discord_bot_token }}
      {% if minimax_api_key is defined and minimax_api_key | length > 0 %}
      MINIMAX_API_KEY={{ minimax_api_key }}
      _HERMES_FORCE_MINIMAX_API_KEY={{ minimax_api_key }}
      {% endif %}
  no_log: true
  notify: restart_campaign

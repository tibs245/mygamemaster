---
# Updates the CREDENTIALS of one or more campaign(s) without rebuilding the image or
# re-rendering the config: rewrites the environment file from the vault, then
# restarts the instance. Run after an `ansible-vault edit ...`.
#   ansible-playbook playbooks/update-credentials.yml -e game=mistfall --ask-vault-pass
#   ('-e campagne=<slug>' still works as a legacy alias)
- name: Update credentials
  hosts: "{{ game | default(campagne | default('campagnes')) }}"
  gather_facts: true
  tasks:
    - name: Rewrite the campaign environment file
      ansible.builtin.include_role:
        name: hermes_deploy
        tasks_from: credentials

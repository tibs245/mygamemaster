---
# Updates the CONFIG of one (or more) campaign(s) without rebuilding the image or
# touching secrets: re-renders config.yaml + SOUL.md from the games.yml table +
# templates, then restarts the instance if anything changed.
#   ansible-playbook playbooks/update-config.yml -e game=mistfall
#   ('-e campagne=<slug>' still works as a legacy alias)
- name: Update the configuration
  hosts: "{{ game | default(campagne | default('campagnes')) }}"
  gather_facts: true
  tasks:
    - name: Re-render the campaign configuration
      ansible.builtin.include_role:
        name: hermes_deploy
        tasks_from: config
